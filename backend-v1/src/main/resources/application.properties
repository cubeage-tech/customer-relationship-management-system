spring.application.name=crm-backend

server.port=8080

# PostgreSQL datasource
# spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
# spring.datasource.username=postgres.hnebpeaandmwzpavafkm
# spring.datasource.password=Sakshi@0555
# spring.datasource.driver-class-name=org.postgresql.Driver
# app.supabase.url=https://hnebpeaandmwzpavafkm.supabase.co

# PostgreSQL datasource (local)
spring.datasource.url=jdbc:postgresql://localhost:5432/crm_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.com.company.crm=${APP_LOG_LEVEL:INFO}

# Payment gateway (FR-5.1). `provider` picks the PaymentGateway implementation (only
# `razorpay` exists today). Keys come from the environment — never commit them. Leave
# blank to run without payments: checkout endpoints then return 502 PAYMENT_GATEWAY_ERROR.
payment.gateway.provider=${PAYMENT_PROVIDER:razorpay}
payment.gateway.key-id=${PAYMENT_KEY_ID:rzp_test_TiyVgKENqirRUB}
payment.gateway.key-secret=${PAYMENT_KEY_SECRET:se2Q2bsLY4AdkxlR1iJ6IKDz}
# Secret configured on the provider's webhook (Razorpay Dashboard → Webhooks)
payment.gateway.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}

# Subscriptions — trial starts when the tenant admin verifies their email. After expiry a
# paid plan is past_due for `grace-days`, then expired (tenant becomes read-only).
app.subscription.trial-plan=${SUBSCRIPTION_TRIAL_PLAN:business}
app.subscription.trial-days=${SUBSCRIPTION_TRIAL_DAYS:14}
app.subscription.grace-days=${SUBSCRIPTION_GRACE_DAYS:7}
app.subscription.status-refresh-cron=${SUBSCRIPTION_STATUS_REFRESH_CRON:0 0 * * * *}

# Pagination for list endpoints called with page/size (opt-in; without them lists are unpaged).
app.pagination.default-size=${PAGINATION_DEFAULT_SIZE:20}
app.pagination.max-size=${PAGINATION_MAX_SIZE:100}

# Feature flags
# Sales managers see only their team's records (sales_teams). false = tenant-wide, as before V17.
app.features.sales-team-scope=${FEATURE_SALES_TEAM_SCOPE:true}

# JWT
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32chars-min}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# Mail (SMTP) — Mailtrap sandbox for local/dev signup-verification email
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:37bcbe6878f15c}
spring.mail.password=${MAIL_PASSWORD:0c495b454098a0}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL of the frontend app — used to build links inside outgoing emails
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Quotations (BR-3/FR-4.3) — discount % above this threshold requires approval before a
# quotation can be sent. SRS §13 marks the exact figure and approver hierarchy as an open
# question for the client; this is a reasonable default until a per-tenant setting exists.
app.quotation.discount-approval-threshold-percent=${QUOTATION_DISCOUNT_THRESHOLD:15}

# Service tickets (FR-6.4) — SLA resolution window per priority, in hours. SRS §6.6 marks
# exact durations as an open question for the client; these are reasonable ITSM-style defaults
# until a per-tenant setting exists.
app.ticket.sla-hours.critical=${TICKET_SLA_HOURS_CRITICAL:4}
app.ticket.sla-hours.high=${TICKET_SLA_HOURS_HIGH:8}
app.ticket.sla-hours.medium=${TICKET_SLA_HOURS_MEDIUM:24}
app.ticket.sla-hours.low=${TICKET_SLA_HOURS_LOW:72}

# Bootstrap super_admin account (created on first startup if it doesn't exist yet)
app.seed.super-admin-email=${SUPER_ADMIN_EMAIL:superadmin@smartcrm.ai}
app.seed.super-admin-password=${SUPER_ADMIN_PASSWORD:ChangeMe123!}

