spring.application.name=crm-backend
# Local secrets (DATA_ENCRYPTION_KEY, ANTHROPIC_API_KEY, ...) can live in backend-v1/.env (git-ignored); real env vars win.
spring.config.import=optional:file:.env[.properties]

server.port=8080

# PostgreSQL datasource
# spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
# spring.datasource.username=postgres.hnebpeaandmwzpavafkm
# spring.datasource.password=Sakshi@0555
# spring.datasource.driver-class-name=org.postgresql.Driver
# app.supabase.url=https://hnebpeaandmwzpavafkm.supabase.co

# PostgreSQL datasource (local)
spring.datasource.url=jdbc:postgresql://localhost:5432/crm_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# NFR-7.1b: lazy associations of a list (owners, teams, customers) load in batches, not one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.com.company.crm=${APP_LOG_LEVEL:INFO}
# API-4: every log line of a request carries its correlation ID (X-Request-Id).
logging.pattern.level=%5p [%X{requestId:-}]

# Payment gateway (FR-5.1). `provider` picks the PaymentGateway implementation (only
# `razorpay` exists today). Keys come from the environment — never commit them. Leave
# blank to run without payments: checkout endpoints then return 502 PAYMENT_GATEWAY_ERROR.
payment.gateway.provider=${PAYMENT_PROVIDER:razorpay}
payment.gateway.key-id=${PAYMENT_KEY_ID:rzp_test_TiyVgKENqirRUB}
payment.gateway.key-secret=${PAYMENT_KEY_SECRET:se2Q2bsLY4AdkxlR1iJ6IKDz}
# Secret configured on the provider's webhook (Razorpay Dashboard → Webhooks)
payment.gateway.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}

# Subscriptions — trial starts when the tenant admin verifies their email. After expiry a
# paid plan is past_due for `grace-days`, then expired (tenant becomes read-only).
app.subscription.trial-plan=${SUBSCRIPTION_TRIAL_PLAN:business}
app.subscription.trial-days=${SUBSCRIPTION_TRIAL_DAYS:14}
app.subscription.grace-days=${SUBSCRIPTION_GRACE_DAYS:7}
app.subscription.status-refresh-cron=${SUBSCRIPTION_STATUS_REFRESH_CRON:0 0 * * * *}

# Pagination for list endpoints called with page/size (opt-in; without them lists are unpaged).
app.pagination.default-size=${PAGINATION_DEFAULT_SIZE:20}
app.pagination.max-size=${PAGINATION_MAX_SIZE:100}

# Feature flags
# Sales managers see only their team's records (sales_teams). false = tenant-wide, as before V17.
app.features.sales-team-scope=${FEATURE_SALES_TEAM_SCOPE:true}

# JWT
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32chars-min}
# NFR-7.2b: master key for encrypting personal contact data at rest (base64 of 32 random bytes,
# e.g. `openssl rand -base64 32`). Required — the app won't start without it. Keep it in the
# deployment's secret store and never change or lose it: data encrypted with it can't be read without it.
app.security.data-encryption-key=${DATA_ENCRYPTION_KEY:}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:86400000}
# API-G01: how long a refresh token keeps a device signed in without the password (rotated on every use).
app.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:14}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# Mail (SMTP) — Mailtrap sandbox for local/dev signup-verification email
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:37bcbe6878f15c}
spring.mail.password=${MAIL_PASSWORD:0c495b454098a0}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL of the frontend app — used to build links inside outgoing emails
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
# FR-7.1c/7.4: public address of THIS API, used in campaign emails for open/click tracking and
# unsubscribe links (must be reachable from the recipient's mail app). Falls back to the Twilio
# webhook base URL, which is the same public API address.
app.campaign.public-api-url=${PUBLIC_API_URL:${TWILIO_WEBHOOK_BASE_URL:http://localhost:8080}}

# FR-M.4 mobile push (Firebase Cloud Messaging HTTP v1). Path to a Firebase service-account JSON key;
# blank = push off (notifications still appear in the app inbox). Never commit the key file.
app.push.fcm.credentials-file=${FCM_CREDENTIALS_FILE:}

# API-G11 AI features that use a language model (chat, email generation, sentiment): Claude via the
# Anthropic API. Blank key = those endpoints answer 503 "AI not configured" (lead score and forecast
# work regardless). Customer names, industries and deal details are sent to the provider.
app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${AI_MODEL:claude-opus-5-5}
# NFR-7.1c: generative answers within 8 s - low effort, a small output cap, one attempt with a hard timeout.
app.ai.effort=${AI_EFFORT:low}
app.ai.max-tokens=${AI_MAX_TOKENS:4096}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:8}

# Quotations (BR-3/FR-4.3) — discount % above this threshold requires approval before a
# quotation can be sent. SRS §13 marks the exact figure and approver hierarchy as an open
# question for the client; this is a reasonable default until a per-tenant setting exists.
app.quotation.discount-approval-threshold-percent=${QUOTATION_DISCOUNT_THRESHOLD:15}

# Service tickets (FR-6.4) — SLA resolution window per priority, in hours. SRS §6.6 marks
# exact durations as an open question for the client; these are reasonable ITSM-style defaults
# until a per-tenant setting exists.
app.ticket.sla-hours.critical=${TICKET_SLA_HOURS_CRITICAL:4}
app.ticket.sla-hours.high=${TICKET_SLA_HOURS_HIGH:8}
app.ticket.sla-hours.medium=${TICKET_SLA_HOURS_MEDIUM:24}
app.ticket.sla-hours.low=${TICKET_SLA_HOURS_LOW:72}

# Bootstrap super_admin account (created on first startup if it doesn't exist yet)
app.seed.super-admin-email=${SUPER_ADMIN_EMAIL:superadmin@smartcrm.ai}
app.seed.super-admin-password=${SUPER_ADMIN_PASSWORD:ChangeMe123!}

# server end point
# server.servlet.context-path=/smart-crm

# Communication (Module 5). Every channel is off until its env vars are set; no secret defaults.
# Bare 10-digit phone numbers get this country code.
app.communication.default-country-code=${DEFAULT_COUNTRY_CODE:+91}
# FR-5.1 email: sent through the SMTP settings above; replies come back to REPLY_TO and are read over IMAP.
app.communication.email.from=${COMM_EMAIL_FROM:}
app.communication.email.reply-to=${COMM_EMAIL_REPLY_TO:}
# INT-2: campaigns may go out from their own address (e.g. news@...), keeping marketing apart from
# transactional mail's sender reputation. Blank = COMM_EMAIL_FROM.
app.communication.email.marketing-from=${MARKETING_EMAIL_FROM:}
app.communication.email.imap.enabled=${IMAP_ENABLED:false}
app.communication.email.imap.host=${IMAP_HOST:}
app.communication.email.imap.port=${IMAP_PORT:993}
app.communication.email.imap.username=${IMAP_USERNAME:}
app.communication.email.imap.password=${IMAP_PASSWORD:}
app.communication.email.imap.folder=${IMAP_FOLDER:INBOX}
app.communication.email.imap.poll-interval-ms=${IMAP_POLL_INTERVAL_MS:60000}
# FR-5.2 WhatsApp / FR-5.3 SMS via Twilio. WEBHOOK_BASE_URL = public https URL of this API (for
# delivery callbacks and webhook signature checks).
app.communication.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.communication.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.communication.twilio.sms-from=${TWILIO_SMS_FROM:}
app.communication.twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}
app.communication.twilio.webhook-base-url=${TWILIO_WEBHOOK_BASE_URL:}

# Customer documents (FR-1.5). Files are kept on local disk under this folder (a persistent,
# backed-up volume in production); only metadata is in Postgres. Uploads: PDF/DOCX/XLSX/JPG/PNG, max 25 MB.
app.documents.storage-path=${DOCUMENT_STORAGE_PATH:./data/documents}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# ERR-5: alert the operations team about critical errors (unhandled request errors, failed scheduled
# jobs). Either or both: comma-separated emails, and a Slack/Teams/Google Chat incoming webhook URL.
app.ops.alert-emails=${OPS_ALERT_EMAILS:}
app.ops.alert-webhook-url=${OPS_ALERT_WEBHOOK_URL:}
app.ops.alert-throttle-minutes=${OPS_ALERT_THROTTLE_MINUTES:15}
app.ops.environment=${OPS_ENVIRONMENT:${spring.application.name}}

# NOT-1: the weekly digest email (Monday 08:00 server time by default; each user can opt out).
# Which other events notify, and how, is set per tenant in Settings → Notifications (NOT-6).
app.notifications.weekly-digest-enabled=${WEEKLY_DIGEST_ENABLED:true}
app.notifications.weekly-digest-cron=${WEEKLY_DIGEST_CRON:0 0 8 * * MON}

# SEC-1c: two-step sign-in (authenticator app). Roles that must use it (comma-separated role names);
# everyone else may turn it on in their profile.
app.security.mfa.required-roles=${MFA_REQUIRED_ROLES:super_admin,admin}
app.security.mfa.issuer=${MFA_ISSUER:SmartCRM}

# SEC-1b: password rules. A new password needs this many characters (three kinds of character, not
# common, not the user's name/email), mustn't be one of the last PASSWORD_HISTORY passwords, and is
# checked against known breaches (Have I Been Pwned; only a 5-character hash prefix is sent).
app.security.password.min-length=${PASSWORD_MIN_LENGTH:10}
app.security.password.history=${PASSWORD_HISTORY:5}
app.security.password.breach-check=${PASSWORD_BREACH_CHECK:true}

# INT-9: outbound integration calls are logged (no payloads) and kept this many days.
app.integration.call-log.retention-days=${INTEGRATION_CALL_LOG_RETENTION_DAYS:90}
