<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Audit Report</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#f1f3f6;--text:#1b1f24;--muted:#5d6672;--border:#dde1e6;
  --accent:#3b5bdb;--accent-weak:#e7ecfd;
  --crit:#b42318;--crit-bg:#fde8e7;--high:#c4320a;--high-bg:#fdeee6;--med:#9a6700;--med-bg:#fff4d6;--low:#4b5563;--low-bg:#eceff3;
  --ok:#1a7f37;--ok-bg:#e3f4e8;--part:#9a6700;--part-bg:#fff4d6;--bad:#b42318;--bad-bg:#fde8e7;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0f1216;--surface:#171b21;--surface-2:#1e232b;--text:#e6e9ee;--muted:#9aa4b1;--border:#2b313a;
  --accent:#8ea6ff;--accent-weak:#232c48;
  --crit:#ff8a80;--crit-bg:#3a1c1b;--high:#ffa070;--high-bg:#3a2418;--med:#f2c94c;--med-bg:#352c12;--low:#c2c9d3;--low-bg:#262c35;
  --ok:#6fdc8c;--ok-bg:#16301f;--part:#f2c94c;--part-bg:#352c12;--bad:#ff8a80;--bad-bg:#3a1c1b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 64px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:28px 0 10px}
.sub{color:var(--muted);font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1216}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card .v{font-size:26px;font-weight:650;margin-top:2px}
.card.sev-critical .v{color:var(--crit)}.card.sev-high .v{color:var(--high)}.card.sev-medium .v{color:var(--med)}.card.sev-low .v{color:var(--low)}
.card.st-working .v{color:var(--ok)}.card.st-partially-broken .v{color:var(--part)}.card.st-broken .v{color:var(--bad)}
.meta{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13px}
.meta dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.meta dt{color:var(--muted)}.meta dd{margin:0;overflow-wrap:anywhere}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.b-critical{color:var(--crit);background:var(--crit-bg)}.b-high{color:var(--high);background:var(--high-bg)}
.b-medium{color:var(--med);background:var(--med-bg)}.b-low{color:var(--low);background:var(--low-bg)}
.b-working{color:var(--ok);background:var(--ok-bg)}.b-partially-broken{color:var(--part);background:var(--part-bg)}.b-broken{color:var(--bad);background:var(--bad-bg)}
.b-neutral{color:var(--muted);background:var(--surface-2)}
.flows{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.flow{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer}
.flow:hover,.flow.active{border-color:var(--accent)}
.flow .fh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.flow .fid{font-family:var(--mono);font-size:12px;color:var(--muted)}
.flow .fn{font-weight:600;margin:2px 0 4px}
.flow .fd{color:var(--muted);font-size:13px}
.flow details{margin-top:6px;font-size:13px}
.flow ol{margin:6px 0 0;padding-left:18px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
.filters input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:7px 10px}
.filters select{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:7px 8px;max-width:100%}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--surface-2);cursor:pointer;user-select:none;white-space:nowrap}
th .arr{opacity:.6;margin-left:4px}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
tr.row td.id{font-family:var(--mono);font-size:12px;white-space:nowrap}
tr.detail td{background:var(--bg);padding:14px 16px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dgrid .full{grid-column:1/-1}
.dsec h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.dsec p{margin:0;white-space:pre-wrap}
.dsec ul,.dsec ol{margin:0;padding-left:18px}
pre{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;font:12px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 0}
code{font-family:var(--mono);font-size:12px}
.fixhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.notes{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
.notes h3{font-size:13px;margin:10px 0 4px}
.notes ul{margin:0;padding-left:18px;font-size:13px}
.notes .files{columns:2;column-gap:24px;font-family:var(--mono);font-size:11.5px}
@media (max-width:700px){.dgrid{grid-template-columns:1fr}.notes .files{columns:1}}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#f4f4f4}
  .btns,.filters,.btn.copy{display:none!important}
  .wrap{max-width:none;padding:0}
  .tablewrap{overflow:visible;border:none}
  table{min-width:0}
  tr.detail{display:table-row!important}
  tr.row,tr.detail,.flow,.card{break-inside:avoid}
  .flow details{display:block}.flow details>*{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Flow Audit Report</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="btns">
      <button class="btn" id="btn-json" type="button">Export JSON</button>
      <button class="btn" id="btn-csv" type="button">Export filtered as CSV</button>
      <button class="btn" id="btn-theme" type="button" aria-label="Toggle dark or light theme">Dark mode</button>
      <button class="btn" id="btn-print" type="button">Print</button>
    </div>
  </header>

  <section>
    <h2>Issues by severity</h2>
    <div class="cards" id="sev-cards"></div>
    <h2>Flows by status</h2>
    <div class="cards" id="status-cards"></div>
    <div class="meta" id="meta"></div>
  </section>

  <section>
    <h2>Flows <span class="sub">(click a flow to filter issues)</span></h2>
    <div class="flows" id="flows"></div>
  </section>

  <section>
    <h2>Issues</h2>
    <div class="filters">
      <input type="search" id="q" placeholder="Search title, description, file…" aria-label="Search issues">
      <select id="f-severity" aria-label="Filter by severity"></select>
      <select id="f-category" aria-label="Filter by category"></select>
      <select id="f-layer" aria-label="Filter by layer"></select>
      <select id="f-flow" aria-label="Filter by flow"></select>
      <select id="f-status" aria-label="Filter by status"></select>
      <button class="btn" id="btn-reset" type="button">Reset</button>
      <button class="btn" id="btn-expand" type="button">Expand all</button>
      <span class="count" id="count"></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>Notes</h2>
    <div class="notes" id="notes"></div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("report-data").textContent);
  var SEV_ORDER = { critical: 0, high: 1, medium: 2, low: 3 };
  var CONF_ORDER = { high: 0, medium: 1, low: 2 };
  var flowsById = {};
  data.flows.forEach(function (f) { flowsById[f.flowId] = f; });

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function $(id) { return document.getElementById(id); }
  function badge(cls, text) { return '<span class="badge b-' + esc(cls) + '">' + esc(text) + "</span>"; }

  // ---------- theme ----------
  var root = document.documentElement;
  function applyTheme(t) {
    root.setAttribute("data-theme", t);
    $("btn-theme").textContent = t === "dark" ? "Light mode" : "Dark mode";
    try { localStorage.setItem("flow-audit-theme", t); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem("flow-audit-theme"); } catch (e) {}
  applyTheme(saved || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  $("btn-theme").addEventListener("click", function () {
    applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  $("btn-print").addEventListener("click", function () { window.print(); });

  // ---------- header + summary ----------
  var m = data.meta;
  $("title").textContent = "Flow Audit — " + m.project;
  document.title = "Flow Audit — " + m.project;
  $("subtitle").textContent = "Generated " + m.generatedAt + " · " + m.totalFlows + " flows · " + m.totalIssues + " issues · static analysis";

  $("sev-cards").innerHTML = ["critical", "high", "medium", "low"].map(function (s) {
    return '<div class="card sev-' + s + '"><div class="k">' + esc(s) + '</div><div class="v">' +
      esc(data.summary.bySeverity[s] || 0) + "</div></div>";
  }).join("");
  $("status-cards").innerHTML = ["working", "partially-broken", "broken"].map(function (s) {
    return '<div class="card st-' + s + '"><div class="k">' + esc(s) + '</div><div class="v">' +
      esc(data.summary.byStatus[s] || 0) + "</div></div>";
  }).join("");

  var stackRows = Object.keys(m.stack || {}).map(function (k) {
    return "<dt>" + esc(k) + "</dt><dd>" + esc(m.stack[k]) + "</dd>";
  }).join("");
  $("meta").innerHTML = "<dl><dt>Frontend</dt><dd><code>" + esc(m.frontendPath) + "</code></dd><dt>Backend</dt><dd><code>" +
    esc(m.backendPath) + "</code></dd>" + stackRows + "</dl>";

  // ---------- flows ----------
  function renderFlows() {
    var active = $("f-flow").value;
    $("flows").innerHTML = data.flows.map(function (f) {
      return '<div class="flow' + (active === f.flowId ? " active" : "") + '" data-flow="' + esc(f.flowId) + '" tabindex="0" role="button">' +
        '<div class="fh"><span class="fid">' + esc(f.flowId) + "</span>" + badge(f.status, f.status) + "</div>" +
        '<div class="fn">' + esc(f.name) + "</div>" +
        '<div class="fd">' + esc(f.description) + "</div>" +
        '<div class="fd" style="margin-top:4px">' + esc(f.issueIds.length) + " issue" + (f.issueIds.length === 1 ? "" : "s") +
        (f.issueIds.length ? ": " + f.issueIds.map(esc).join(", ") : "") + "</div>" +
        "<details><summary>Steps</summary><ol>" + f.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></details>" +
        "</div>";
    }).join("");
  }
  $("flows").addEventListener("click", function (e) {
    if (e.target.closest("details")) return;
    var el = e.target.closest(".flow");
    if (!el) return;
    var id = el.getAttribute("data-flow");
    $("f-flow").value = $("f-flow").value === id ? "" : id;
    update();
    $("q").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("flows").addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("flow")) { e.preventDefault(); e.target.click(); }
  });

  // ---------- filters ----------
  function uniq(key) {
    var seen = {};
    data.issues.forEach(function (i) { seen[i[key]] = true; });
    return Object.keys(seen).sort();
  }
  function fillSelect(id, label, values, labeler) {
    $(id).innerHTML = '<option value="">All ' + esc(label) + "</option>" + values.map(function (v) {
      return '<option value="' + esc(v) + '">' + esc(labeler ? labeler(v) : v) + "</option>";
    }).join("");
  }
  fillSelect("f-severity", "severities", ["critical", "high", "medium", "low"].filter(function (s) { return uniq("severity").indexOf(s) >= 0; }));
  fillSelect("f-category", "categories", uniq("category"));
  fillSelect("f-layer", "layers", uniq("layer"));
  fillSelect("f-flow", "flows", data.flows.map(function (f) { return f.flowId; }), function (id) { return id + " · " + flowsById[id].name; });
  fillSelect("f-status", "statuses", uniq("status"));

  // ---------- table ----------
  var COLS = [
    { key: "id", label: "ID" },
    { key: "severity", label: "Severity" },
    { key: "title", label: "Title" },
    { key: "flowId", label: "Flow" },
    { key: "category", label: "Category" },
    { key: "layer", label: "Layer" },
    { key: "confidence", label: "Confidence" },
    { key: "effort", label: "Effort" },
    { key: "status", label: "Status" }
  ];
  var sortKey = "severity", sortDir = 1, expanded = {}, allExpanded = false;

  function sortVal(issue, key) {
    if (key === "severity") return SEV_ORDER[issue.severity];
    if (key === "confidence") return CONF_ORDER[issue.confidence];
    if (key === "effort") return { S: 0, M: 1, L: 2 }[issue.effort];
    return String(issue[key] || "").toLowerCase();
  }
  function haystack(i) {
    return [i.id, i.title, i.description, i.impact, i.flowId, i.category, i.layer, i.evidence,
      i.location.map(function (l) { return l.file + " " + l.symbol; }).join(" "),
      i.suggestedFix && i.suggestedFix.summary].join(" ").toLowerCase();
  }
  function filtered() {
    var q = $("q").value.trim().toLowerCase();
    var f = {
      severity: $("f-severity").value, category: $("f-category").value, layer: $("f-layer").value,
      flowId: $("f-flow").value, status: $("f-status").value
    };
    return data.issues.filter(function (i) {
      for (var k in f) { if (f[k] && i[k] !== f[k]) return false; }
      return !q || haystack(i).indexOf(q) >= 0;
    }).sort(function (a, b) {
      var x = sortVal(a, sortKey), y = sortVal(b, sortKey);
      if (x < y) return -sortDir;
      if (x > y) return sortDir;
      return a.id < b.id ? -1 : 1;
    });
  }

  function renderHead() {
    $("thead").innerHTML = COLS.map(function (c) {
      var arr = c.key === sortKey ? (sortDir === 1 ? "▲" : "▼") : "";
      return '<th data-key="' + c.key + '" scope="col">' + esc(c.label) + '<span class="arr">' + arr + "</span></th>";
    }).join("");
  }
  $("thead").addEventListener("click", function (e) {
    var th = e.target.closest("th");
    if (!th) return;
    var k = th.getAttribute("data-key");
    if (k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
    update();
  });

  function list(items, ordered) {
    if (!items || !items.length) return "<p>—</p>";
    var tag = ordered ? "ol" : "ul";
    return "<" + tag + ">" + items.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</" + tag + ">";
  }
  function detailHtml(i) {
    var loc = i.location.map(function (l) {
      return "<li><code>" + esc(l.file) + (l.lines ? ":" + esc(l.lines) : "") + "</code>" + (l.symbol ? " — " + esc(l.symbol) : "") + "</li>";
    }).join("");
    var fx = i.suggestedFix || {};
    return '<div class="dgrid">' +
      '<div class="dsec full"><h4>Description</h4><p>' + esc(i.description) + "</p></div>" +
      '<div class="dsec full"><h4>Impact</h4><p>' + esc(i.impact) + "</p></div>" +
      '<div class="dsec full"><h4>Location</h4><ul>' + loc + "</ul></div>" +
      '<div class="dsec"><h4>Steps to reproduce</h4>' + list(i.stepsToReproduce, true) + "</div>" +
      '<div class="dsec"><h4>Expected vs actual</h4><p><strong>Expected:</strong> ' + esc(i.expectedBehavior) +
        "</p><p style=\"margin-top:6px\"><strong>Actual:</strong> " + esc(i.actualBehavior) + "</p></div>" +
      '<div class="dsec full"><h4>Evidence</h4><pre>' + esc(i.evidence) + "</pre></div>" +
      '<div class="dsec full"><div class="fixhead"><h4>Suggested fix</h4>' +
        '<button class="btn copy" type="button" data-copy="' + esc(i.id) + '">Copy fix</button></div>' +
        "<p><strong>" + esc(fx.summary) + "</strong></p>" +
        (fx.details ? '<p style="margin-top:4px">' + esc(fx.details) + "</p>" : "") +
        (fx.codeSuggestion ? "<pre>" + esc(fx.codeSuggestion) + "</pre>" : "") +
      "</div>" +
      (i.fix ? '<div class="dsec full"><h4>Fix (' + esc(i.status) + ")</h4>" +
        "<p><strong>" + esc(i.fix.summary) + "</strong></p>" +
        '<p style="margin-top:4px">' + esc(i.fix.fixedAt) + " · " + esc(i.fix.triggeredBy) + " · " + esc(i.fix.verification) + "</p>" +
        list((i.fix.filesChanged || []).map(function (c) { return c.file + (c.lines ? ":" + c.lines : "") + " (" + c.type + ")"; })) +
        (i.fix.remainingWork ? '<p style="margin-top:4px"><strong>Remaining:</strong> ' + esc(i.fix.remainingWork) + "</p>" : "") +
      "</div>" : "") +
      "</div>";
  }

  var current = [];
  function renderBody() {
    current = filtered();
    $("count").textContent = current.length + " of " + data.issues.length + " issues";
    if (!current.length) {
      $("tbody").innerHTML = '<tr><td colspan="' + COLS.length + '" class="empty">No issues match these filters.</td></tr>';
      return;
    }
    $("tbody").innerHTML = current.map(function (i) {
      var open = allExpanded || expanded[i.id];
      var flow = flowsById[i.flowId];
      return '<tr class="row" data-id="' + esc(i.id) + '" aria-expanded="' + (open ? "true" : "false") + '" tabindex="0">' +
        '<td class="id">' + esc(i.id) + "</td>" +
        "<td>" + badge(i.severity, i.severity) + "</td>" +
        "<td>" + esc(i.title) + "</td>" +
        '<td title="' + esc(flow ? flow.name : "") + '"><code>' + esc(i.flowId) + "</code></td>" +
        "<td>" + esc(i.category) + "</td>" +
        "<td>" + esc(i.layer) + "</td>" +
        "<td>" + badge("neutral", i.confidence) + "</td>" +
        "<td>" + esc(i.effort) + "</td>" +
        "<td>" + esc(i.status) + "</td></tr>" +
        '<tr class="detail" data-for="' + esc(i.id) + '"' + (open ? "" : ' style="display:none"') + '><td colspan="' + COLS.length + '">' +
        detailHtml(i) + "</td></tr>";
    }).join("");
  }
  $("tbody").addEventListener("click", function (e) {
    var copyBtn = e.target.closest("button[data-copy]");
    if (copyBtn) { copyFix(copyBtn); return; }
    var row = e.target.closest("tr.row");
    if (!row) return;
    var id = row.getAttribute("data-id");
    expanded[id] = !expanded[id];
    var det = row.nextElementSibling;
    var open = det.style.display === "none";
    det.style.display = open ? "" : "none";
    row.setAttribute("aria-expanded", open ? "true" : "false");
  });
  $("tbody").addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("row")) { e.preventDefault(); e.target.click(); }
  });

  function copyFix(btn) {
    var id = btn.getAttribute("data-copy");
    var issue = data.issues.filter(function (i) { return i.id === id; })[0];
    var fx = issue.suggestedFix || {};
    var text = [id + ": " + issue.title, "", fx.summary, fx.details, fx.codeSuggestion].filter(Boolean).join("\n\n");
    function done(ok) {
      btn.textContent = ok ? "Copied" : "Copy failed";
      setTimeout(function () { btn.textContent = "Copy fix"; }, 1500);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
    } else {
      done(fallbackCopy(text));
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  function update() { renderHead(); renderBody(); renderFlows(); }
  ["q", "f-severity", "f-category", "f-layer", "f-flow", "f-status"].forEach(function (id) {
    $(id).addEventListener(id === "q" ? "input" : "change", update);
  });
  $("btn-reset").addEventListener("click", function () {
    $("q").value = "";
    ["f-severity", "f-category", "f-layer", "f-flow", "f-status"].forEach(function (id) { $(id).value = ""; });
    update();
  });
  $("btn-expand").addEventListener("click", function () {
    allExpanded = !allExpanded;
    expanded = {};
    $("btn-expand").textContent = allExpanded ? "Collapse all" : "Expand all";
    renderBody();
  });

  // ---------- exports ----------
  function download(name, mime, text) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  $("btn-json").addEventListener("click", function () {
    download("report.json", "application/json", JSON.stringify(data, null, 2));
  });
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise spreadsheet formula injection
    return '"' + s.replace(/"/g, '""') + '"';
  }
  $("btn-csv").addEventListener("click", function () {
    var head = ["id", "severity", "title", "flowId", "flowName", "category", "layer", "confidence", "effort", "status",
      "locations", "description", "impact", "expectedBehavior", "actualBehavior", "suggestedFix"];
    var rows = current.map(function (i) {
      return [i.id, i.severity, i.title, i.flowId, (flowsById[i.flowId] || {}).name, i.category, i.layer, i.confidence,
        i.effort, i.status,
        i.location.map(function (l) { return l.file + (l.lines ? ":" + l.lines : ""); }).join("; "),
        i.description, i.impact, i.expectedBehavior, i.actualBehavior, (i.suggestedFix || {}).summary].map(csvCell).join(",");
    });
    download("issues-filtered.csv", "text/csv;charset=utf-8", "﻿" + [head.map(csvCell).join(",")].concat(rows).join("\r\n"));
  });

  // ---------- notes ----------
  var n = data.notes || {};
  $("notes").innerHTML =
    "<h3>Assumptions</h3>" + list(n.assumptions) +
    "<h3>Not analyzed</h3>" + list(n.notAnalyzed) +
    '<h3>Files reviewed (' + esc((n.filesReviewed || []).length) + ')</h3><ul class="files">' +
    (n.filesReviewed || []).map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>";

  update();
})();
</script>
